
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f6">
  <meta name="description" content="A personal gemstone encyclopedia, comparison library and statistics explorer.">

  <title>Gem Library</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-shell">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-symbol">◇</div>
        <div>
          <div class="brand-name">GEM LIBRARY</div>
          <div class="brand-subtitle">Personal Encyclopedia</div>
        </div>
      </div>

      <nav class="main-navigation" aria-label="Main navigation">

        <button class="nav-button active" data-page="library">
          <span class="nav-icon">▦</span>
          <span>Library</span>
        </button>

        <button class="nav-button" data-page="compare">
          <span class="nav-icon">⇄</span>
          <span>Comparison</span>
        </button>

        <button class="nav-button" data-page="relations">
          <span class="nav-icon">◎</span>
          <span>Relationships</span>
        </button>

        <button class="nav-button" data-page="statistics">
          <span class="nav-icon">▥</span>
          <span>Statistics</span>
        </button>

      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-bottom">

        <div class="library-counter">
          <span>Saved gemstones</span>
          <strong id="sidebar-count">0</strong>
        </div>

        <button class="side-action" id="export-button">
          Export Library
        </button>

        <button class="side-action" id="import-button">
          Import Library
        </button>

        <button class="side-action" id="reset-button">
          Clear Library
        </button>

        <div class="sidebar-note">
          Stored locally in this browser.
          Export backups to protect your collection.
        </div>

      </div>

    </aside>

    <!-- MAIN AREA -->

    <div class="main-shell">

      <header class="topbar">

        <div class="topbar-left">
          <span class="topbar-label">GEM LIBRARY</span>
          <span class="topbar-separator">/</span>
          <span id="current-page-label">Library</span>
        </div>

        <div class="topbar-actions">

          <button
            class="button button-primary"
            id="new-gem-button">
            + New Gemstone
          </button>

        </div>

      </header>

      <main id="main-content" class="main-content" tabindex="-1">
      </main>

    </div>

  </div>


  <!-- MOBILE NAVIGATION -->

  <nav class="mobile-navigation" aria-label="Mobile navigation">

    <button class="mobile-nav-button active" data-page="library">
      <span>▦</span>
      <small>Library</small>
    </button>

    <button class="mobile-nav-button" data-page="compare">
      <span>⇄</span>
      <small>Compare</small>
    </button>

    <button class="mobile-nav-button" data-page="relations">
      <span>◎</span>
      <small>Relations</small>
    </button>

    <button class="mobile-nav-button" data-page="statistics">
      <span>▥</span>
      <small>Statistics</small>
    </button>

  </nav>


  <!-- PROFILE EDITOR -->

  <div id="editor-overlay" class="overlay hidden">

    <section
      class="editor-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="editor-heading">

      <div class="dialog-header">

        <div>
          <div class="eyebrow">GEMSTONE PROFILE</div>
          <h2 id="editor-heading">New Gemstone</h2>
        </div>

        <button
          class="icon-button"
          id="close-editor-button"
          aria-label="Close editor">
          ×
        </button>

      </div>

      <div class="editor-scroll">

        <form id="gem-form" novalidate>
          <div id="editor-fields"></div>
        </form>

      </div>

      <div class="dialog-footer">

        <div class="editor-status" id="editor-status">
          Unsaved profile
        </div>

        <div class="dialog-footer-actions">

          <button
            type="button"
            class="button button-secondary"
            id="cancel-editor-button">
            Close
          </button>

          <button
            type="submit"
            form="gem-form"
            class="button button-primary"
            id="save-gem-button">
            Save Gemstone
          </button>

        </div>

      </div>

    </section>

  </div>


  <!-- CONFIRMATION WINDOW -->

  <div id="confirm-overlay" class="overlay hidden">

    <section
      class="confirm-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title">

      <h2 id="confirm-title">Confirm Action</h2>

      <p id="confirm-message"></p>

      <div class="confirm-actions">

        <button
          class="button button-secondary"
          id="confirm-cancel">
          Cancel
        </button>

        <button
          class="button button-danger"
          id="confirm-accept">
          Confirm
        </button>

      </div>

    </section>

  </div>


  <!-- NOTIFICATIONS -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite">
  </div>


  <!-- IMPORT INPUT -->

  <input
    type="file"
    id="import-file"
    accept=".json,application/json"
    hidden>


  <!-- JAVASCRIPT -->

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
